services:

  postgres:
    image: postgres:17
    container_name: trainingnutrition_db
    environment:
      POSTGRES_USER: tnuser
      POSTGRES_PASSWORD: tnpassword
      POSTGRES_DB: trainingnutrition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  redis:
    image: redis:7-alpine
    container_name: trainingnutrition_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: